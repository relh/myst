[project]
name = "myst"
version = "0.1.0"
description = "Myst is a combination of Stable Diffusion and VGGT/DepthAnything/Metric3D to create worlds that are 3D aware and go beyond outpainting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core dependencies
    "Pillow>=10.0.0",
    "DateTime>=5.0",
    "matplotlib>=3.7.0",
    "plyfile>=1.1.0",
    "HTML4Vision>=0.5.0",
    "timm>=1.0.0",
    "tensorboardX>=2.6.0",
    "imgaug>=0.4.0",
    "iopath>=0.1.0",
    "imagecorruptions>=1.1.0",
    "numpy>=1.24.0",
    "lpips>=0.1.4",
    "gradio>=4.0.0",
    
    # 3D and computer vision
    "open3d>=0.19.0",
    "kornia>=0.7.2,<0.8.0",
    # "pytorch3d>=0.7.8",  # Commented out due to version conflicts - will use fallback renderer
    "trimesh>=4.0.0",
    
    # AI/ML frameworks
    "diffusers>=0.34.0",
    "transformers>=4.30.0",
    "accelerate>=0.30.0",
    "huggingface-hub>=0.30.0",
    
    # Computer vision and ML
    "mmcv>=2.2.0",
    "mmengine>=0.10.0",
    "einops>=0.8.0",
    
    # Rerun for visualization
    "rerun-sdk>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "flake8",
]

[tool.uv]
dev-dependencies = [
    "ruff",
    "black", 
    "flake8",
]
